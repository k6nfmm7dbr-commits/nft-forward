name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4（pin 完整 commit SHA，防供应链替换）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-go@v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt 未通过: $out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: benchmark（conntrack parser，仅记录不设阈值）
        run: |
          go test -run XXX -bench=ParseConntrack -benchmem ./internal/connection/ | tee /tmp/bench.txt
          echo "### conntrack parser benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Benchmark' /tmp/bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: shellcheck（安装器 / 脚本静态检查）
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning install.sh
          shellcheck -S warning -e SC2034 scripts/*.sh tests/*.sh

      - name: 安装/升级流程测试（提取 install.sh 真实实现）
        run: bash tests/installer_flow_test.sh

      - name: v0.3.2 基线收口测试（认证 / 暴露面 / fail-safe / 内容级自愈 / readiness）
        run: bash tests/baseline_test.sh

      # 真实 nftables + network namespace E2E。
      #
      # GitHub Hosted Runner（ubuntu-latest）确实提供 root(sudo)、nftables 内核模块
      # 与 network namespace 能力，因此完整数据面 E2E 可以在 CI 里跑。
      # 唯一的限制是 runner 上没有已安装的 nft-forward 服务，所以这里先用本地构建的
      # 二进制做一次沙箱安装（NFF_CORE_BIN + NFF_ROOT 由安装器支持），再跑 E2E。
      - name: 真实 nftables 能力探测
        id: nftcap
        run: |
          sudo apt-get install -y -qq nftables conntrack >/dev/null 2>&1 || true
          # conntrack 是在线 IP / IP 限制的事实来源：先尽力加载模块并开启字节计费。
          sudo modprobe nf_conntrack 2>/dev/null || true
          sudo sysctl -w net.netfilter.nf_conntrack_acct=1 >/dev/null 2>&1 || true
          echo "--- conntrack 数据源探测（三种）---"
          CT_OK=false
          # 1) /proc/net/nf_conntrack（本程序实际使用的数据源）
          if sudo test -r /proc/net/nf_conntrack; then
            CT_OK=true
            echo "  [ok] /proc/net/nf_conntrack 可读，条目数：$(sudo wc -l < /proc/net/nf_conntrack)"
          else
            echo "  [--] /proc/net/nf_conntrack 不可读"
          fi
          # 2) /proc/net/ip_conntrack（很老的内核）
          if sudo test -r /proc/net/ip_conntrack; then
            echo "  [ok] /proc/net/ip_conntrack 可读（legacy 路径）"
          else
            echo "  [--] /proc/net/ip_conntrack 不存在"
          fi
          # 3) conntrack CLI（仅用于诊断，本程序不依赖它）
          if sudo conntrack -L -o extended >/dev/null 2>&1; then
            echo "  [ok] conntrack CLI 可用（诊断用；产品代码不依赖）"
          else
            echo "  [--] conntrack CLI 不可用"
          fi
          echo "nf_conntrack_acct=$(sudo sysctl -n net.netfilter.nf_conntrack_acct 2>/dev/null || echo '?')"
          echo "ct=$CT_OK" >> "$GITHUB_OUTPUT"
          if [ "$CT_OK" != "true" ]; then
            echo "::warning::runner 上 /proc/net/nf_conntrack 不可读 —— 在线 IP / IP 限制的真实数据面 E2E 无法在此环境验证（parser / policy / slot 状态机由单元测试完整覆盖）"
          fi
          if sudo nft list tables >/dev/null 2>&1 && sudo ip netns add nff-cap-probe 2>/dev/null; then
            sudo ip netns del nff-cap-probe
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::runner 缺少 nftables / netns 能力，跳过真实数据面 E2E"
          fi

      - name: 真实数据面 E2E（netns + nftables）
        if: steps.nftcap.outputs.ok == 'true'
        run: |
          set -e
          CGO_ENABLED=0 go build -o /tmp/nft-forward ./cmd/nft-forward
          sudo mkdir -p /etc/nft-forward
          sudo install -m 0600 /dev/null /etc/nft-forward/panel.json
          echo '{}' | sudo tee /etc/nft-forward/panel.json >/dev/null
          sudo install -m 0755 /tmp/nft-forward /usr/local/bin/nft-forward
          # 首次初始化：随机五位数端口 + 令牌 + 入口路径
          sudo /usr/local/bin/nft-forward config-ensure-all
          sudo bash scripts/e2e_netns.sh setup

          # ── CI runner 专用的转发环境准备（产品脚本绝不做这件事）──
          # GitHub Hosted Runner 预装 Docker，Docker 会把 iptables FORWARD 链
          # 的默认 policy 设成 DROP。netns 客户端 → 转发主机 → backend 的包走
          # FORWARD 路径，会被这条系统级 policy 丢掉，表现为「转发不通」——
          # 这是 runner 环境限制，不是产品缺陷。
          # 这里只为测试网段插入 ACCEPT，并且**只在 CI 里做**：真机上 nft-forward
          # 承诺绝不触碰用户的系统链。
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv4.conf.all.route_localnet=1 >/dev/null || true
          echo "--- iptables FORWARD policy（准备前）---"
          sudo iptables -S FORWARD | head -5 || true
          sudo iptables -I FORWARD 1 -s 10.203.0.0/24 -j ACCEPT
          sudo iptables -I FORWARD 1 -d 10.203.0.0/24 -j ACCEPT
          echo "--- iptables FORWARD（准备后）---"
          sudo iptables -S FORWARD | head -5 || true

          # 后台起服务（CI 没有 systemd 用户会话，直接跑 serve）
          sudo sh -c 'NFT_FORWARD_CONF=/etc/nft-forward/panel.json \
            /usr/local/bin/nft-forward serve > /tmp/nff-serve.log 2>&1 &'
          PORT=$(sudo /usr/local/bin/nft-forward config-get port)
          for _ in $(seq 1 20); do
            if curl -fsS -m 2 "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # 转发链路自检：确认 netns 客户端能直连 backend。
          # 若这一步就不通，说明 runner 网络环境不支持，后续断言无意义 ——
          # 此时明确失败并打印诊断，绝不静默跳过。
          sudo ip netns exec nff-client1 curl -fsS -m 10 http://10.203.0.100/small \
            || { echo "::error::runner 上 netns 客户端无法直连 backend"; \
                 sudo ip netns exec nff-client1 ip route; sudo iptables -S FORWARD; exit 1; }

          sudo bash scripts/e2e_fault.sh || { sudo tail -50 /tmp/nff-serve.log; exit 1; }
          sudo bash scripts/e2e_full.sh  || { sudo tail -50 /tmp/nff-serve.log; \
                 sudo nft list ruleset | head -60; exit 1; }
          sudo bash scripts/verify_quota_realtime.sh || { sudo tail -30 /tmp/nff-serve.log; exit 1; }

          sudo bash scripts/e2e_netns.sh clean
          sudo pkill -f 'nft-forward serve' || true
          sudo /usr/local/bin/nft-forward clear || true
          sudo iptables -D FORWARD -s 10.203.0.0/24 -j ACCEPT || true
          sudo iptables -D FORWARD -d 10.203.0.0/24 -j ACCEPT || true

  # 二进制分发：main 全部测试通过后，把全架构产物发布到 dist 分支（rolling latest）。
  # dist 是普通分支，不是 Tag —— 安装器固定从 raw .../dist/<artifact> 下载。
  # 仅当本次提交实际影响产物/安装器时才重建发布（纯 docs 跳过）。
  publish-dist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      # actions/setup-go@v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23"

      - name: 判断是否影响产物/安装器（纯 docs 跳过）
        id: changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- cmd internal go.mod go.sum \
              scripts install.sh; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "无产物相关变更，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建全架构二进制
        if: steps.changed.outputs.skip != 'true'
        run: ./scripts/build-release.sh dist

      - name: SHA256SUMS 自检 + 版本三方一致性（APP_VERSION/Go/二进制）
        if: steps.changed.outputs.skip != 'true'
        run: bash scripts/artifact_check.sh dist

      - name: 分发清单一致性（产物与 scripts/dist-manifest.txt 完全一致）
        if: steps.changed.outputs.skip != 'true'
        run: |
          ls dist | sort > /tmp/actual.txt
          sort scripts/dist-manifest.txt > /tmp/expected.txt
          diff /tmp/expected.txt /tmp/actual.txt || {
            echo "::error::dist 产物与清单不一致"; exit 1;
          }

      - name: 发布到 dist 分支（force-push，仅产物文件）
        if: steps.changed.outputs.skip != 'true'
        run: |
          git config user.name "nff-dist-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin dist || true   # 首次运行时 dist 分支尚不存在，属正常
          git checkout --orphan dist-new
          # 只清空索引、不动工作区（不能用 git rm -rf .，那会把刚构建的产物删掉）。
          # 必须用 read-tree --empty：`git rm -r --cached .` 在「工作区文件与 HEAD
          # 内容都不同」时会报错退出，一旦被 `|| true` 吞掉，整个源码树会留在索引里，
          # dist 分支会被推成上百个文件。
          git read-tree --empty
          if [ -n "$(git ls-files)" ]; then
            echo "::error::索引未清空，拒绝发布 dist"; git ls-files | head -20; exit 1
          fi
          # 产物必须位于分支根（安装器请求 raw .../dist/<file>，不带子目录）
          VER="$(grep -m1 '^const Version' internal/version/version.go | sed 's/.*"\(.*\)".*/\1/')"
          cp dist/nft-forward-linux-* dist/SHA256SUMS .
          git add -f nft-forward-linux-* SHA256SUMS
          git add scripts/dist-manifest.txt
          # 发布前断言：dist 分支只能含产物 + 清单，不得夹带源码
          tracked="$(git ls-files | sort)"
          expected="$(printf '%s\n' SHA256SUMS scripts/dist-manifest.txt \
            $(cd dist && ls nft-forward-linux-*) | sort)"
          if [ "$tracked" != "$expected" ]; then
            echo "::error::dist 分支内容不符合预期"
            diff <(echo "$expected") <(echo "$tracked") || true
            exit 1
          fi
          git commit -qm "dist: rebuild from ${GITHUB_SHA::7} (v$VER)"
          git push -f origin dist-new:dist

      - name: 验证 raw 分发地址真实可用
        if: steps.changed.outputs.skip != 'true'
        run: |
          sleep 10
          for f in nft-forward-linux-amd64 nft-forward-linux-arm64 SHA256SUMS; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' \
              "https://raw.githubusercontent.com/${{ github.repository }}/dist/$f")
            [ "$code" = "200" ] || { echo "::error::分发地址不可用: $f -> HTTP $code"; exit 1; }
            echo "  [OK] $f -> 200"
          done
