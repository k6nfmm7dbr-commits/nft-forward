<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NFT Forward · 端口转发面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg>
    </span>
    <div class="brand-txt">
      <strong>NFT Forward 面板</strong>
      <small>nftables 端口转发 · 流量监控</small>
    </div>
  </div>
  <div class="topbar-right">
    <div class="conn-chip">
      <span id="pulse"></span>
      <em id="status-txt">连接中…</em>
    </div>
    <form class="logout-form" method="post" action="logout">
      <button type="submit" class="icon-btn" id="btn-logout" aria-label="退出登录" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </form>
  </div>
</header>

<main class="wrap">

  <!-- ===== 总览 ===== -->
  <section class="view on" id="view-home">

    <div class="hero glass">
      <div class="hero-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>实时速率</span>
      </div>
      <div id="hero-rate" class="hero-rate">—</div>
      <div class="hero-pair">
        <div class="pair up">
          <i aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </i>
          <div><small>上传</small><b id="hero-up">—</b></div>
        </div>
        <div class="pair down">
          <i aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          </i>
          <div><small>下载</small><b id="hero-down">—</b></div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>今日流量</span>
        </div>
        <b id="kpi-today-total">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span>累计流量</span>
        </div>
        <b id="kpi-all-total">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>TCP 连接</span>
        </div>
        <b id="kpi-conns">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>
          <span>UDP 会话</span>
        </div>
        <b id="kpi-conns-udp">—</b>
      </div>
      <div class="stat glass wide">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg>
          <span>启用规则</span>
        </div>
        <b id="kpi-rules">—</b>
      </div>
    </div>

    <div class="panel glass">
      <div class="panel-head">
        <h2>转发规则</h2>
        <button class="mini-btn primary" id="btn-new-rule">＋ 添加规则</button>
      </div>
      <div id="rule-cards" class="node-list"></div>
    </div>

  </section>

  <!-- ===== 每日趋势 ===== -->
  <section class="view" id="view-daily">
    <div class="panel glass">
      <div class="panel-head"><h2>每日流量趋势</h2><span class="hint">最近 60 天 · 全部规则</span></div>
      <div id="daily-table"></div>
    </div>
  </section>

  <!-- ===== 单规则趋势 ===== -->
  <section class="view" id="view-rules">
    <div class="panel glass">
      <div class="panel-head">
        <h2>规则详情</h2>
        <select id="rule-select" aria-label="选择规则"></select>
      </div>
      <div id="rule-daily-table"></div>
    </div>
  </section>

</main>

<!-- ===== 底部导航 ===== -->
<nav class="dock glass">
  <button class="tab on" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    <span>总览</span>
  </button>
  <button class="tab" data-view="daily">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>趋势</span>
  </button>
  <button class="tab" data-view="rules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/><circle cx="19" cy="7" r="2"/><circle cx="5" cy="17" r="2"/></svg>
    <span>规则</span>
  </button>
</nav>

<div class="drawer-mask" id="drawer-mask"></div>

<!-- ===== 添加规则（桌面右侧抽屉 / 移动底部 sheet） ===== -->
<aside class="drawer" id="new-drawer" role="dialog" aria-modal="true" aria-labelledby="new-title">
  <header class="drawer-head">
    <div>
      <small>转发规则</small>
      <h3 id="new-title">添加规则</h3>
    </div>
    <button class="icon-btn" id="new-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="drawer-body">
    <section class="sect">
      <div class="field">
        <label for="new-name">名称</label>
        <input type="text" id="new-name" placeholder="" autocomplete="off" maxlength="64">
      </div>
      <div class="field">
        <label for="new-proto">协议</label>
        <select id="new-proto">
          <option value="tcp+udp" selected>TCP + UDP</option>
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
        </select>
      </div>
      <div class="field">
        <label for="new-listen-port">监听端口</label>
        <input type="number" id="new-listen-port" placeholder="留空则随机" min="1" max="65535" inputmode="numeric">
      </div>
      <div class="field">
        <label for="new-target">目标地址</label>
        <input type="text" id="new-target" placeholder="IP 或域名" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="new-target-port">目标端口</label>
        <input type="number" id="new-target-port" placeholder="" min="1" max="65535" inputmode="numeric">
      </div>
    </section>
    <div class="err hidden" id="new-error"></div>
  </div>

  <footer class="drawer-foot">
    <button class="btn" id="new-cancel">取消</button>
    <button class="btn primary" id="new-submit">添加</button>
  </footer>
</aside>

<!-- ===== 规则管理抽屉 ===== -->
<aside class="drawer" id="policy-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div>
      <small>规则管理</small>
      <h3 id="drawer-rule-name">—</h3>
    </div>
    <button class="icon-btn" id="drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="drawer-body">
    <section class="sect">
      <div class="sect-title">转发设置</div>
      <div class="field">
        <label for="pol-name">名称</label>
        <input type="text" id="pol-name" maxlength="64" autocomplete="off">
      </div>
      <div class="field">
        <label for="pol-proto">协议</label>
        <select id="pol-proto">
          <option value="tcp+udp">TCP + UDP</option>
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
        </select>
      </div>
      <div class="field">
        <label for="pol-listen-port">监听端口</label>
        <input type="number" id="pol-listen-port" min="1" max="65535" inputmode="numeric">
      </div>
      <div class="field">
        <label for="pol-listen-ip">监听 IP</label>
        <input type="text" id="pol-listen-ip" value="0.0.0.0" disabled>
      </div>
      <div class="field">
        <label for="pol-target">目标地址</label>
        <input type="text" id="pol-target" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="pol-target-port">目标端口</label>
        <input type="number" id="pol-target-port" min="1" max="65535" inputmode="numeric">
      </div>
      <label class="switch-row">
        <div><b>启用规则</b><small>停用后立即撤销转发，历史流量保留</small></div>
        <input type="checkbox" id="pol-enable" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
    </section>

    <!-- 域名规则才显示：当前解析结果（只读） -->
    <section class="sect hidden" id="pol-dns-sect">
      <div class="sect-title">域名解析</div>
      <div class="kv"><span>目标地址</span><b id="pol-dns-host">—</b></div>
      <div class="kv"><span>当前解析 IPv4</span><b id="pol-dns-v4">—</b></div>
      <div class="kv"><span>当前解析 IPv6</span><b id="pol-dns-v6">—</b></div>
      <div class="kv"><span>解析状态</span><b id="pol-dns-status">—</b></div>
    </section>

    <section class="sect">
      <div class="sect-title">流量配额</div>
      <label class="switch-row">
        <div><b>启用配额</b><small>超出后仅阻断该规则转发</small></div>
        <input type="checkbox" id="pol-quota-enable" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
      <div class="field summary-field">
        <small>当前已用</small>
        <output id="pol-quota-used">—</output>
      </div>
      <div id="pol-quota-box" class="box hidden">
        <div class="field row">
          <input type="number" id="pol-quota-val" min="1" step="1" inputmode="decimal" placeholder="500">
          <select id="pol-quota-unit">
            <option value="GiB" selected>GiB</option>
            <option value="TiB">TiB</option>
          </select>
        </div>
      </div>
      <button type="button" class="ghost-btn" id="pol-quota-reset">重置当前使用量（保留历史）</button>
    </section>

    <section class="sect">
      <div class="sect-title">IP 数量限制</div>
      <label class="switch-row">
        <div><b>启用限制</b><small>达上限后阻止新 IP 接入</small></div>
        <input type="checkbox" id="pol-ip-enable" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
      <div class="field summary-field">
        <small>当前在线 IP</small>
        <output id="pol-ip-active">—</output>
      </div>
      <div id="pol-ip-box" class="box hidden">
        <div class="field row">
          <input type="number" id="pol-ip-max" min="1" step="1" inputmode="numeric" placeholder="最大同时在线数">
        </div>
      </div>
    </section>

    <section class="danger-zone">
      <div class="sect-title">危险操作</div>
      <small>删除后立即撤销转发；今日 / 累计 / 每日历史流量仍会保留可查。</small>
      <button type="button" class="btn danger" id="pol-delete">删除规则</button>
    </section>

    <div class="err hidden" id="pol-error"></div>
  </div>

  <footer class="drawer-foot">
    <button class="btn" id="pol-cancel">取消</button>
    <button class="btn primary" id="pol-save">保存</button>
  </footer>
</aside>

<!-- ===== 在线 IP 抽屉 ===== -->
<aside class="drawer" id="ips-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div>
      <small>在线 IP</small>
      <h3 id="ips-rule-name">—</h3>
    </div>
    <button class="icon-btn" id="ips-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body"><div id="ips-list" class="ips-list"></div></div>
</aside>

<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
